name: Code Intelligence CI
on:
  push:
    branches: [master]
  schedule:
    - cron: '0 0 * * *'

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: node-version: 20
      - run: npm install
      - run: node dist/cli.js . --full -o /tmp/scan-report.json
      - run: cat /tmp/scan-report.json
